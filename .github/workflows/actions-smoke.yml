name: Validate action upgrades

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up application Node without automatic caching
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Create a synthetic artifact
        run: |
          node --version
          printf 'Node 24 action compatibility check\n' > "$RUNNER_TEMP/actions-smoke.md"
      - name: Upload only the synthetic artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actions-smoke
          path: ${{ runner.temp }}/actions-smoke.md
          if-no-files-found: error
          retention-days: 1
      - name: Download the same artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: actions-smoke
          path: ${{ runner.temp }}/actions-smoke-download
      - name: Verify exact artifact contents
        run: cmp "$RUNNER_TEMP/actions-smoke.md" "$RUNNER_TEMP/actions-smoke-download/actions-smoke.md"
