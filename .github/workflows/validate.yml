name: Validate candidate

on:
  workflow_call:
    inputs:
      platform:
        type: string
        default: macos-latest
      baseline:
        type: string
        default: ''
      candidate:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 60
    steps:
      - name: Check out baseline without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseline || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download prepared candidate
        if: inputs.candidate != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-candidate
          path: ${{ runner.temp }}/upstream-candidate
      - name: Load exact candidate without executing its workflow
        if: inputs.candidate != ''
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git bundle verify "$RUNNER_TEMP/upstream-candidate/candidate.bundle"
          git fetch "$RUNNER_TEMP/upstream-candidate/candidate.bundle" 'refs/heads/*:refs/remotes/candidate/*'
          git checkout --detach "$CANDIDATE_COMMIT"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build frontend
        run: npm run build
      - name: Run mock and update-safety tests
        if: inputs.platform == 'macos-latest'
        run: |
          npm run test:mocks
          node --test .github/scripts/upstream-sync.check.mjs
      - name: Build and test MCP
        run: |
          npm --prefix mcp-server ci --ignore-scripts --no-audit --no-fund
          npm --prefix mcp-server test
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install native dependencies on macOS
        if: inputs.platform == 'macos-latest'
        run: brew install protobuf
      - name: Install native dependencies on Ubuntu
        if: inputs.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler
      - name: Install native dependencies on Windows
        if: inputs.platform == 'windows-latest'
        run: choco install protoc -y
      - name: Run native tests on macOS
        if: inputs.platform == 'macos-latest'
        working-directory: src-tauri
        run: cargo test --locked --lib
      - name: Check other supported builds
        if: inputs.platform != 'macos-latest'
        working-directory: src-tauri
        run: cargo check --locked
